<!DOCTYPE html>
<html>
<body>

<h2>Chat Room</h2>

<input id="msg" placeholder="Enter message">
<button onclick="send()">Send</button>

<ul id="chat"></ul>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
// 🔥 CONNECT DIRECTLY TO BACKEND (PORT 5000)
const socket = io("http://:5000");

const username = sessionStorage.getItem("username");

// Receive messages
socket.on("receiveMessage", data => {
    chat.innerHTML += `<li><b>${data.sender}:</b> ${data.message}</li>`;
});

// Send message
function send(){
    if(!msg.value) return;

    socket.emit("sendMessage", {
        sender: username,
        message: msg.value
    });

    msg.value = ""; // clear input
}
</script>

</body>
</html>
